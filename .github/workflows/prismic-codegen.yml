name: prismic-codegen
# The Prismic CLI writes prismicio-types.d.ts and src/lib/slices/index.ts from
# the models on disk. A model.json or customtypes/<id>/index.json edited without
# re-running `pnpm prismic:gen` leaves the types describing models that no
# longer exist, and nothing else in CI would notice: svelte-check reads the
# stale file as truth. This job regenerates both and fails on any difference.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm prismic:gen
        env:
          PRISMIC_TELEMETRY_ENABLED: "false"
      - name: Generated files match the models
        run: |
          set -euo pipefail
          changed="$(git status --porcelain -- prismicio-types.d.ts src/lib/slices)"
          if [ -n "$changed" ]; then
            echo "::error::Generated Prismic files are stale. Run pnpm prismic:gen and commit the result."
            echo "$changed"
            git diff -- prismicio-types.d.ts src/lib/slices | head -100
            exit 1
          fi
